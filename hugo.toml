baseURL = "https://tangyuan233.github.io/"
languageCode = "zh-cn"
title = "L.Tang's Log"
theme = "PaperMod"

[pagination]
pagerSize = 5

[params]
env = "production"
description = "L.Tang's personal log"
author = "L.Tang"

# 首页信息
[params.homeInfoParams]
Title = "Hi there!"
Content = """
Hi, this is L.Tang. I'm documenting my learning and thinking notes in this log.
"""

# 显示设置
ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = false
hideFooter = false
hideSummary = false
showtoc = true
tocopen = false

# 社交图标
[[params.socialIcons]]
name = "twitter"
url = "https://x.com/TangThree"

[[params.socialIcons]]
name = "github"
url = "https://github.com/tangyuan233"

[[params.socialIcons]]
name = "rss"
url = "/index.xml"

# 菜单
[menu]
[[menu.main]]
name = "Posts"
url = "/posts/"
weight = 1

[[menu.main]]
name = "Search"
url = "/search/"
weight = 2

# 输出格式（用于搜索功能）
[outputs]
home = ["HTML", "RSS", "JSON"]

# 语法高亮
[markup]
[markup.highlight]
anchorLineNos = false
codeFences = true
guessSyntax = true
lineNos = false
noClasses = false
style = "monokai"